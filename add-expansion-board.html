<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW BlueCon — Add Expansion Board</title>
<link rel="stylesheet" href="themes/default.css">
<style>
  :root {
    --color-bg: #F4F5F7; --color-surface: #FFFFFF; --color-border: #E7E9EC;
    --color-text: #1B2430; --color-text-muted: rgba(27, 36, 48, 0.68); --color-text-faint: rgba(27, 36, 48, 0.65);
    --color-primary: #1B2430; --color-primary-hover: #0F151D; --color-accent: #3E7BFA;
    --color-danger: #D34247; --color-success: #2BA23E;
    --color-danger-bg: #FDECEC; --color-success-bg: #E9F8EC; --color-accent-bg: #EAF1FF;
    --font-sans: Arial, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --text-heading: 20px; --text-body: 15px; --text-label: 13px;
    --radius-card: 20px; --radius-sm: 12px; --radius-pill: 999px;
    --shadow-card: 0 16px 32px rgba(27, 36, 48, 0.06); --shadow-card-sm: 0 6px 16px rgba(27, 36, 48, 0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: #DDE1E6; color: var(--color-text); padding: 40px 16px 80px; }
  button, select, input { font-family: var(--font-sans); }

  .phone { width: 375px; margin: 0 auto; background: var(--color-bg); border-radius: 36px; box-shadow: 0 30px 60px rgba(10,14,20,0.35), 0 0 0 10px #15181d, 0 0 0 11px #2a2e35; overflow: hidden; height: 760px; display: flex; flex-direction: column; position: relative; }
  .status-ios { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 600; color: var(--color-text); flex-shrink: 0; }

  .shell-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; flex-shrink: 0; }
  .role-badge { background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: var(--radius-pill); }
  .conn-status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #1C7F2C; }
  .conn-status .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); flex-shrink: 0; }
  .shell-header-right { display: flex; align-items: center; gap: 10px; }
  .exit-device-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: var(--color-text-muted); text-decoration: none; flex-shrink: 0; }
  .exit-device-btn:hover { background: rgba(27, 36, 48, 0.08); color: var(--color-text); }

  .screen-title-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px; flex-shrink: 0; }
  .back-btn { appearance: none; border: none; background: none; color: var(--color-text); cursor: pointer; padding: 2px; display: flex; flex-shrink: 0; }
  .screen-title-text { font-size: var(--text-heading); font-weight: 600; }

  .content { flex: 1; overflow-y: auto; padding-bottom: 24px; position: relative; }

  .bullets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 0 24px 18px; font-size: 12.5px; color: var(--color-text-muted); }
  .bullets-grid div::before { content: "• "; }

  .board-row { position: relative; display: flex; align-items: center; gap: 4px; padding: 13px 34px 13px 16px; background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card-sm); margin: 0 24px 23px; }
  .board-name { font-size: 17px; font-weight: 700; color: var(--color-text); width: 58px; flex-shrink: 0; }
  .board-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .board-desc { font-size: 13.5px; color: var(--color-text-muted); }
  .board-serial { font-size: 12.5px; color: var(--color-text-faint); }
  /* Status dot sits at the card's top-right corner, not centered with the row — matches the design exactly. */
  .board-dot { position: absolute; top: 12px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-success); flex-shrink: 0; }
  .board-dot.pending { background: #D98A2B; }

  .board-slot-empty { position: relative; border: 1px dashed #C1C5CC; border-radius: var(--radius-card); margin: 0 24px 24px; height: 55px; }
  .board-slot-empty .slot-dot { position: absolute; top: 12px; right: 14px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid #C1C5CC; }

  .scan-footer { flex-shrink: 0; text-align: center; padding: 10px 24px 16px; }
  .scan-hint { font-size: 12.5px; color: var(--color-text-faint); font-style: italic; line-height: 1.5; margin-bottom: 12px; }
  .btn-scan { appearance: none; border: none; width: calc(100% - 32px); margin: 0 16px; background: var(--color-primary); color: #fff; font-size: 15px; font-weight: 600; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-scan:disabled { background: #C9CCD1; cursor: not-allowed; }
  .btn-scan .spinner { display: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; animation: spin 0.8s linear infinite; }
  .btn-scan.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: absolute; left: 16px; right: 16px; bottom: 18px; background: var(--color-primary); color: #fff; padding: 12px 16px; border-radius: var(--radius-sm); font-size: var(--text-label); font-weight: 500; transform: translateY(40px); opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 50; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="phone">
  <div class="status-ios"><span>9:41</span><span>●●●●  5G  🔋</span></div>
  <div class="shell-header">
    <span class="role-badge">Central Unit</span>
    <div class="shell-header-right">
      <span class="conn-status"><span class="status-dot"></span>Connected</span>
      <a class="exit-device-btn" href="device-scan.html" title="Exit device"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
    </div>
  </div>
  <div class="screen-title-row">
    <button class="back-btn" onclick="window.location.href='home.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="screen-title-text">Expansion Boards</span>
  </div>

  <div class="content">
    <div class="bullets-grid">
      <div>Plug and Play connection</div><div>Up to 4 boards</div>
      <div>Passthrough connection</div><div>Up to 32 Relays in total</div>
    </div>

    <div id="board-list"></div>
  </div>

  <div class="scan-footer">
    <div class="scan-hint">Connect board directly to Central or Remote unit and Press Scan Bus</div>
    <button class="btn-scan" id="scan-btn" onclick="scanOrSave()">
      <span class="spinner"></span><span id="scan-btn-label">Scan Bus</span>
    </button>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
let boards = [
  { name: 'W2', desc: 'Desc: 2 Wiegand ports', serial: 'Serial: W2B-0021-7743', status: 'online' },
  { name: 'R2IO', desc: 'Desc: 2 Inputs & 2 Relay out', serial: 'Serial: R2IOB-0237-7743', status: 'online' },
];
const MAX_BOARDS = 4;
let pendingSlot = null;

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2600);
}

function renderBoards(){
  const list = document.getElementById('board-list');
  let html = boards.map(b => `
    <div class="board-row">
      <div class="board-name">${b.name}</div>
      <div class="board-info"><div class="board-desc">${b.desc}</div><div class="board-serial">${b.serial}</div></div>
      <div class="board-dot${b.status === 'pending' ? ' pending' : ''}"></div>
    </div>`).join('');
  for(let i = boards.length; i < MAX_BOARDS; i++){
    html += `<div class="board-slot-empty"><span class="slot-dot"></span></div>`;
  }
  list.innerHTML = html;

  const btn = document.getElementById('scan-btn');
  const label = document.getElementById('scan-btn-label');
  if(pendingSlot !== null){
    label.textContent = 'Save';
    btn.disabled = false;
  } else if(boards.length >= MAX_BOARDS){
    label.textContent = 'Scan Bus';
    btn.disabled = true;
  } else {
    label.textContent = 'Scan Bus';
    btn.disabled = false;
  }
}

function scanOrSave(){
  const btn = document.getElementById('scan-btn');
  if(pendingSlot !== null){
    boards[pendingSlot].status = 'online';
    pendingSlot = null;
    renderBoards();
    toast('Board saved');
    return;
  }
  btn.classList.add('loading');
  btn.disabled = true;
  setTimeout(()=>{
    btn.classList.remove('loading');
    boards.push({ name: 'R2IO', desc: 'Desc: 2 Inputs & 2 Relay out', serial: 'Serial: R2IOB-00' + (48 + boards.length) + '-7743', status: 'pending' });
    pendingSlot = boards.length - 1;
    renderBoards();
    toast('New board detected');
  }, 1100);
}

renderBoards();
</script>
</body>
</html>
